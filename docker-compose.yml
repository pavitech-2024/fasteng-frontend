
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_build:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev -- -H 0.0.0.0

volumes:
  node_modules:
  next_build:
